<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline</title>
<style>
  body { font-family: system-ui, sans-serif; background:#FBF6EE; color:#3D3330;
         display:flex; min-height:100vh; align-items:center; justify-content:center; margin:0; padding:24px; }
  .box { text-align:center; max-width:340px; }
  .emoji { font-size:48px; }
  h1 { font-size:22px; margin:14px 0 8px; }
  p { font-size:15px; color:#7A6F69; line-height:1.5; }
  button { margin-top:20px; padding:13px 26px; border:none; border-radius:14px;
           background:#E8927C; color:#fff; font-size:15px; font-weight:700; cursor:pointer; }
</style>
</head>
<body>
  <div class="box">
    <div class="emoji">🍼</div>
    <h1>Belum bisa memuat</h1>
    <p>App belum tersimpan sepenuhnya untuk mode offline. Sambungkan internet sebentar, buka app sekali sampai tampil penuh, lalu app bisa dipakai offline.</p>
    <button onclick="location.replace('./index.html')">Coba lagi</button>
  </div>
</body>
</html>
